
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration - Exam Management System</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="registration-page">

    <div class="registration-container">

        <h1>Student Registration</h1>

        <p class="registration-subtitle">
            Register yourself to attend the online examination.
        </p>


        <form class="registration-form"
              onsubmit="handleRegistration(event)">


            <div class="registration-field full-width">

                <label for="studentName">Full Name</label>

                <input type="text"
                       id="studentName"
                       placeholder="Enter your full name"
                       required>

            </div>


            <div class="registration-field full-width">

                <label for="address">Address</label>

                <textarea id="address"
                          placeholder="Enter your full address"
                          required></textarea>

            </div>


            <div class="registration-field">

                <label for="gender">Gender</label>

                <select id="gender" required>

                    <option value="">Select Gender</option>

                    <option value="Male">Male</option>

                    <option value="Female">Female</option>

                    <option value="Other">Other</option>

                </select>

            </div>


            <div class="registration-field">

                <label for="age">Age</label>

                <input type="number"
                       id="age"
                       min="1"
                       max="120"
                       placeholder="Enter your age"
                       required>

            </div>


            <div class="registration-field">

                <label for="qualification">Highest Qualification</label>

                <select id="qualification" required>

                    <option value="">Select Qualification</option>

                    <option value="Higher Secondary">Higher Secondary</option>

                    <option value="Diploma">Diploma</option>

                    <option value="Graduation">Graduation</option>

                    <option value="Post Graduation">Post Graduation</option>

                    <option value="Other">Other</option>

                </select>

            </div>


            <div class="registration-field">

                <label for="percentage">Percentage of Marks</label>

                <input type="number"
                       id="percentage"
                       min="0"
                       max="100"
                       step="0.01"
                       placeholder="Enter percentage"
                       required>

            </div>


            <div class="registration-field full-width">

                <label for="contactNo">Contact Number</label>

                <input type="tel"
                       id="contactNo"
                       pattern="[0-9]{10}"
                       maxlength="10"
                       placeholder="Enter 10-digit contact number"
                       required>

            </div>


            <div class="registration-field">

                <label for="password">Create Password</label>

                <input type="password"
                       id="password"
                       minlength="8"
                       placeholder="Create password"
                       required>

            </div>


            <div class="registration-field">

                <label for="confirmPassword">Confirm Password</label>

                <input type="password"
                       id="confirmPassword"
                       minlength="8"
                       placeholder="Confirm password"
                       required>

            </div>


            <button type="submit" class="registration-submit">

                Submit Registration

            </button>

        </form>


        <p class="registration-back">

            Already registered?

            <a href="student-login.html">Student Login</a>

            <br><br>

            <a href="index.html">Back to Home</a>

        </p>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
